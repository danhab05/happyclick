         M139 113Q165 120 185 106Q198 99 225 107L221 120
         L201 114Q191 111 181 116Q154 129 139 120Z"/>
    <!-- Three flexed fingers, the little finger closest to the cuff. -->
    <path fill="#ffd9ab" stroke-width="3.5" d="M108 57Q99 55 93 65L81 79Q75 87 81 94Q88 102 96 96L117 78Q124 71 119 63Q116 58 108 57Z"/>
    <path fill="#ffd9ab" stroke-width="3.5" d="M127 66Q119 60 111 68L96 85Q89 93 95 101Q102 109 111 103L130 87Q140 78 134 71Z"/>
    <path fill="#ffd9ab" stroke-width="3.5" d="M144 78Q135 70 126 79L113 93Q106 100 111 107Q117 115 126 111L144 97Q153 88 144 78Z"/>
